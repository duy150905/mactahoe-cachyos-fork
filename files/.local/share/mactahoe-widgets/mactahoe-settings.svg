<g transform="translate(64 60) rotate(40)"><use href="#sShaft"/><use href="#sHandle"/><use href="#sFerrule"/></g>
</g>
<!-- tools -->
<g transform="translate(64 60) rotate(-40)" stroke="#0B1F4D" stroke-width="1.4" stroke-linejoin="round">
<use href="#hHandle" fill="#5EE0FF"/>
<use href="#hHead" fill="#FFFFFF"/>
</g>
