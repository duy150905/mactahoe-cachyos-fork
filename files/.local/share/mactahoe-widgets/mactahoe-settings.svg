<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128">
<defs>
<clipPath id="ic"><rect width="128" height="128" rx="29"/></clipPath>
<clipPath id="sc"><rect x="19" y="36" width="98" height="72" rx="9"/></clipPath>
<filter id="bl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
<!-- Hammer (local coords, head pointing up) -->
